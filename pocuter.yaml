substitutions:
  name: pocuter
  friendly_name: Pocuter

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # One file for every board. Each one comes up as pocuter-xxxxxx, the last
  # three bytes of its MAC, so they do not fight over one hostname.
  name_add_mac_suffix: true
  # The Display light restores its state before the display is set up, too
  # early to send it contrast commands. From here on its changes apply
  # directly.
  on_boot:
    priority: -100
    then:
      - lambda: id(display_ready) = true;
      - script.execute: apply_display_light

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  # Local on purpose. aw9523b is M5Stack's driver (MIT, from
  # github.com/m5stack/esphome-yaml at cc708dd) with one fix, see
  # components/aw9523b/aw9523b.h. ESPHome itself has no AW9523 support as of
  # 2026.9. mxc4005 is ours, nothing upstream drives the accelerometer.
  - source:
      type: local
      path: components
    components: [aw9523b, mxc4005]

# GPIO20 and GPIO21 are the UART0 pins, and the board uses them for the
# expander INT line and the SD card CS. Logs go out over the native USB port.
logger:
  hardware_uart: USB_SERIAL_JTAG

# The clock has to come up on every power-up, whatever happened before.
# ESPHome's safe_mode counts boots that end within a minute in flash, and
# after 10 of them starts only WiFi and OTA for 5 minutes: dark display. A
# cell running flat resets the board exactly like that, so it is off. This
# also turns off OTA rollback, which needs safe_mode; a broken build needs USB
# to recover.
safe_mode:
  disabled: true

# No reboot after 15 minutes without a Home Assistant client or without WiFi.
# The clock works without either, and a reboot without WiFi loses the time.
api:
  reboot_timeout: 0s
  actions:
    # Scrolls a message through once, like the weekday ticker, then the clock
    # carries on as usual. A message sent while another one waits replaces it.
    - action: ticker_message
      variables:
        message: string
      then:
        - script.execute:
            id: queue_ticker_message
            message: !lambda return message;

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: ${friendly_name} Setup

captive_portal:

time:
  # No timezone here, so Home Assistant can push its own on every sync.
  - platform: homeassistant
    id: ha_time
  # Fallback for a boot with no Home Assistant. No RTC on the board, so until
  # one of these answers the display shows dashes.
  - platform: sntp
    id: sntp_time
    timezone: !secret timezone

# Everything below the ESP32-C3 hangs off this bus: the AW9523B at 0x5B and the
# MXC4005XC at 0x15. The board has 2.7k pullups on both lines. 400kHz matters,
# because the OLED CS and D/C lines are expander pins and every SPI command
# costs several expander writes.
i2c:
  id: bus_i2c
  sda: GPIO8
  scl: GPIO9  # also the BOOT strap; the button near the header pins shorts it to GND
  frequency: 400kHz

# Shared by the OLED and the micro SD slot (CS GPIO21). The OLED is write only.
spi:
  id: bus_spi
  clk_pin: GPIO5
  mosi_pin: GPIO6
  miso_pin: GPIO10

aw9523b:
  - id: expander
    i2c_id: bus_i2c
    address: 0x5B  # AD0 and AD1 both tied high
    # P0 carries the OLED CS and the 12.5V enable, and nothing on the board
    # pulls them up. The chip default, open drain, leaves the display dead.
    # The Pocuter library writes GCR 0x13, which is this plus 1/4 current.
    p0_drive_mode: PUSH_PULL
    # Ceiling for the LED mode sinks. The RGB LED has 2.7k series resistors,
    # so the resistor sets the current long before this does. Matches stock.
    led_max_current: 9.25mA
    # Open drain, 10k pullup on the board. Only pins with use_interrupt raise it.
    interrupt_pin:
      number: GPIO20
      mode:
        input: true

# Expander pin numbers: P0_n is n, P1_n is 8 + n.
#
#   0  P0_0  LED blue (LED mode)     8  P1_0  header P2
#   1  P0_1  button 3                9  P1_1  header P1
#   2  P0_2  OLED 12.5V enable      10  P1_2  LED red (LED mode)
#   3  P0_3  charger STAT           11  P1_3  LED green (LED mode)
#   4  P0_4  SD card detect         12  P1_4  OLED reset
#   5  P0_5  button 2               13  P1_5  OLED D/C
#   6  P0_6  button 1               14  P1_6  header P4
#   7  P0_7  OLED CS                15  P1_7  header P3

switch:
  # What the clock does besides showing the time. Restored across reboots.
  - platform: template
    id: clock_beat
    name: Clock Beat
    icon: mdi:heart-pulse
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: weekday_ticker
    name: Weekday Ticker
    icon: mdi:calendar-week
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: date_ticker
    name: Date Ticker
    icon: mdi:calendar
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

output:
  # Enables the boost converter that makes the 12.5V OLED panel supply. The
  # controller answers every command without it, so a missing enable looks
  # like a dead display. Off means the panel is dark and draws nothing. The
  # controller keeps its RAM on 3.3V, so the picture comes back as it was.
  # Driven by the Display light.
  - platform: gpio
    id: oled_power
    pin:
      aw9523b_id: expander
      number: 2
      mode:
        output: true

  # The Display light needs outputs, but its colour and brightness are read
  # straight from the light by the display lambda and apply_display_light.
  - platform: template
    id: clock_red
    type: float
    write_action:
      - lambda: ""
  - platform: template
    id: clock_green
    type: float
    write_action:
      - lambda: ""
  - platform: template
    id: clock_blue
    type: float
    write_action:
      - lambda: ""

  # LED mode pins sink a constant current, and the LED is common anode to 3.3V,
  # so a higher value is a brighter LED. No inversion.
  - platform: aw9523b
    id: led_red
    aw9523b_id: expander
    pin: 10
  - platform: aw9523b
    id: led_green
    aw9523b_id: expander
    pin: 11
  - platform: aw9523b
    id: led_blue
    aw9523b_id: expander
    pin: 0

light:
  # The whole display as one light: on/off is the panel supply, the colour is
  # the colour of the clock and the ticker, and brightness 1-100% maps to the
  # SSD1331 colour contrasts 1-40%. 100% contrast would be the panel's nominal
  # setting, rated 10,000 hours to half brightness; a clock lights the same
  # pixels all day and burns them in, so 40% is the ceiling for all-day use.
  # The default, 87%, is 35% contrast. No transitions: every step would need a
  # full redraw.
  - platform: rgb
    id: display_light
    name: Display
    icon: mdi:monitor
    red: clock_red
    green: clock_green
    blue: clock_blue
    restore_mode: RESTORE_DEFAULT_ON
    initial_state:
      state: true
      brightness: 87%
      red: 100%
      green: 100%
      blue: 100%
    default_transition_length: 0s
    gamma_correct: 1.0
    on_turn_on:
      - output.turn_on: oled_power
    on_turn_off:
      - output.turn_off: oled_power
    on_state:
      - script.execute: apply_display_light

  - platform: rgb
    id: led
    name: LED
    red: led_red
    green: led_green
    blue: led_blue
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - pulse:

# Charger STAT timing, written by charger_stat below, and the clock pulse
# flag, written by the interval that drives the display.
globals:
  - id: stat_low_since
    type: uint32_t
    initial_value: "0"
  - id: stat_last_blip
    type: uint32_t
    initial_value: "0"
  - id: clock_pulse
    type: bool
    initial_value: "false"
  - id: display_ready
    type: bool
    initial_value: "false"
  # The ticker: millis() when it started (0 while it is not running), the
  # text it scrolls, a message from Home Assistant waiting for its turn, and
  # the minute the weekday last ran in, so that runs once per minute.
  - id: ticker_start
    type: uint32_t
    initial_value: "0"
  - id: ticker_text
    type: std::string
  - id: ticker_pending
    type: std::string
  - id: ticker_minute
    type: int
    initial_value: "-1"

# The display has no update_interval of its own. Once a second it draws the
# time at 40px, then 150ms later at the normal 50px, so the number beats.
# Two frames a second, about 33ms each at 8MHz SPI.
#
# Nothing draws while the Display light is off.
#
# The Clock Beat, Weekday Ticker and Date Ticker switches below turn the
# parts off; without the beat the clock simply redraws once a second.
#
# From second 30 of every minute the weekday name scrolls through instead:
# the clock slides out to the left, the name follows, and the clock slides
# back in to where it started. A message from Home Assistant scrolls the same
# way, once, as soon as no ticker is running; the weekday then waits for it
# until second 35 at the latest. The beat pauses meanwhile, and the 40ms
# interval draws about 25 frames a second until the display lambda ends it.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            light.is_on: display_light
          then:
            - lambda: |-
                auto now = id(ha_time).now();
                if (!now.is_valid())
                  now = id(sntp_time).now();
                if (id(ticker_start) != 0)
                  return;
                if (!id(ticker_pending).empty()) {
                  id(ticker_text) = id(ticker_pending);
                  id(ticker_pending).clear();
                  id(ticker_start) = millis() | 1;
                } else if ((id(weekday_ticker).state || id(date_ticker).state) && now.is_valid() &&
                           now.second >= 30 && now.second < 35 && now.minute != id(ticker_minute)) {
                  // Weekday first, then the date, two spaces apart (21px,
                  // about the 24px the strip leaves around the clock).
                  std::string text;
                  if (id(weekday_ticker).state)
                    text = now.strftime("%A");
                  if (id(date_ticker).state)
                    text += (text.empty() ? "" : "  ") + now.strftime("%Y-%m-%d");
                  id(ticker_minute) = now.minute;
                  id(ticker_text) = text;
                  id(ticker_start) = millis() | 1;
                }
            - if:
                condition:
                  lambda: return id(ticker_start) == 0;
                then:
                  - if:
                      condition:
                        switch.is_on: clock_beat
                      then:
                        - lambda: id(clock_pulse) = true;
                        - component.update: oled
                        - delay: 150ms
                        - lambda: id(clock_pulse) = false;
                        - component.update: oled
                      else:
                        - component.update: oled
  - interval: 40ms
    then:
      - if:
          condition:
            and:
              - light.is_on: display_light
              - lambda: return id(ticker_start) != 0;
          then:
            - component.update: oled

# No behavior attached to the buttons on purpose. Home Assistant is the control
# surface. The small button next to USB is reset (EN), the one near the header
# pins is BOOT (GPIO9); neither is visible to the firmware.
binary_sensor:
  - platform: gpio
    id: button_1
    name: Button 1
    pin:
      aw9523b_id: expander
      number: 6
      mode:
        input: true
      inverted: true  # 10k pullup, switch to GND
      use_interrupt: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
  - platform: gpio
    id: button_2
    name: Button 2
    pin:
      aw9523b_id: expander
      number: 5
      mode:
        input: true
      inverted: true
      use_interrupt: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
  - platform: gpio
    id: button_3
    name: Button 3
    pin:
      aw9523b_id: expander
      number: 1
      mode:
        input: true
      inverted: true
      use_interrupt: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

  # MCP73831 STAT, raw. Low while charging, high when charged or on battery
  # power (10k pullup). With no cell fitted the charger keeps restarting into
  # an empty output, and STAT drops for 3 to 20ms about every 10s (measured on
  # this board). Charging and Battery Present below are derived from it.
  - platform: gpio
    id: charger_stat
    internal: true
    pin:
      aw9523b_id: expander
      number: 3
      mode:
        input: true
      inverted: true
      use_interrupt: true
    on_press:
      - lambda: id(stat_low_since) = millis();
    on_release:
      - lambda: |-
          if (millis() - id(stat_low_since) < 500)
            id(stat_last_blip) = millis();

  # A real charge holds STAT low for minutes, so a second filters out the
  # no-battery blips.
  - platform: template
    id: charging
    name: Charging
    device_class: battery_charging
    lambda: return id(charger_stat).state && millis() - id(stat_low_since) > 1000;

  # Card detect switch closes to GND with a card in, 10k pullup otherwise.
  - platform: gpio
    id: sd_card
    name: SD Card
    icon: mdi:micro-sd
    entity_category: diagnostic
    pin:
      aw9523b_id: expander
      number: 4
      mode:
        input: true
      inverted: true
      use_interrupt: true

  # No blip for five minutes means a cell is there: charging, charged, or
  # running the board. The expander only sees a blip if its read lands inside
  # the pulse, so some are missed and gaps of over a minute happen (measured).
  # Unknown for the first 30s after boot until the first blip had a chance.
  - platform: template
    id: battery_present
    name: Battery Present
    icon: mdi:battery-heart-variant
    entity_category: diagnostic
    lambda: |-
      uint32_t blip = id(stat_last_blip);
      if (blip != 0 && millis() - blip < 5 * 60 * 1000)
        return false;
      if (blip == 0 && millis() < 30000)
        return {};
      return true;

sensor:
  # VBAT through a 1.2M / 1.2M divider. The divider is high impedance, so the
  # first ADC sample after a long idle reads low. The median hides it.
  - platform: adc
    id: battery_voltage
    name: Battery Voltage
    pin: GPIO2
    attenuation: 12db
    update_interval: 10s
    accuracy_decimals: 2
    device_class: voltage
    entity_category: diagnostic
    filters:
      - multiply: 2.0
      - median:
          window_size: 6
          send_every: 6

  # Linear between 3.3V and 4.15V. A LiPo curve is anything but linear, and
  # the reading sits high while charging. Good for a glance, not for a gauge.
  # Unknown without a cell, rather than a made up 100%.
  - platform: template
    id: battery_level
    name: Battery
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      float v = id(battery_voltage).state;
      if (std::isnan(v) || !id(battery_present).has_state() || !id(battery_present).state)
        return NAN;
      return clamp((v - 3.3f) / (4.15f - 3.3f) * 100.0f, 0.0f, 100.0f);

  # Photodiode into an MCP6001 transimpedance stage. Brighter is higher. Not
  # calibrated to lux, so it stays a voltage. Indoor light only gets a few
  # tens of millivolts out of it, so this reads at 0dB (0 to about 0.9V) like
  # the Pocuter library does. Direct sun clips.
  - platform: adc
    id: light_level
    name: Light Sensor
    pin: GPIO1
    attenuation: 0db
    update_interval: 10s
    accuracy_decimals: 3
    icon: mdi:brightness-5

  - platform: mxc4005
    i2c_id: bus_i2c
    update_interval: 10s
    acceleration_x:
      name: Acceleration X
    acceleration_y:
      name: Acceleration Y
    acceleration_z:
      name: Acceleration Z
    temperature:
      name: Board Temperature
      entity_category: diagnostic

  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic

# Cleans a message once, before it waits for the ticker. Typographic
# punctuation from Home Assistant becomes ASCII, and every other character the
# clock font lacks is dropped: drawing one would log a warning twice per frame.
script:
  # Contrast from the Display light's brightness, then a redraw for its
  # colour. Contrast is a few commands and needs the display set up.
  - id: apply_display_light
    then:
      - lambda: |-
          if (!id(display_ready))
            return;
          auto &v = id(display_light).remote_values;
          id(oled)->set_brightness(0.01f + 0.39f * v.get_brightness());
          if (v.is_on())
            id(oled)->update();

  - id: queue_ticker_message
    parameters:
      message: string
    then:
      - lambda: |-
          static const struct { uint32_t from; const char *to; } MAP[] = {
              {0x2013, "-"}, {0x2014, "-"}, {0x2212, "-"}, {0x2018, "'"}, {0x2019, "'"},
              {0x201C, "\""}, {0x201D, "\""}, {0x201E, "\""}, {0x2026, "..."}, {0x00A0, " "},
          };
          std::string out;
          size_t i = 0;
          while (i < message.size()) {
            uint8_t c = message[i];
            uint32_t cp;
            size_t len;
            if (c < 0x80) {
              cp = c, len = 1;
            } else if ((c >> 5) == 0x6 && i + 1 < message.size()) {
              cp = ((c & 0x1F) << 6) | (message[i + 1] & 0x3F), len = 2;
            } else if ((c >> 4) == 0xE && i + 2 < message.size()) {
              cp = ((c & 0x0F) << 12) | ((message[i + 1] & 0x3F) << 6) | (message[i + 2] & 0x3F), len = 3;
            } else if ((c >> 3) == 0x1E && i + 3 < message.size()) {
              cp = ((c & 0x07) << 18) | ((message[i + 1] & 0x3F) << 12) | ((message[i + 2] & 0x3F) << 6) |
                   (message[i + 3] & 0x3F),
              len = 4;
            } else {
              i++;
              continue;
            }
            const char *repl = nullptr;
            for (const auto &m : MAP)
              if (m.from == cp)
                repl = m.to;
            if (repl != nullptr)
              out += repl;
            else if (cp == '\n' || cp == '\t')
              out += ' ';
            else if (id(font_time)->find_glyph(cp) != nullptr)
              out.append(message, i, len);
            i += len;
          }
          id(ticker_pending) = out;

select:
  # How the clock uses the Display light's colour: all of it, hours in the
  # colour and minutes white, or fading from the colour at the top to a
  # darker shade of it at the bottom. The ticker follows.
  - platform: template
    id: clock_style
    name: Clock Style
    icon: mdi:palette
    entity_category: config
    options:
      - Solid
      - Two-tone
      - Gradient
    initial_option: Solid
    optimistic: true
    restore_value: true
    set_action:
      - component.update: oled

# The dashboard way to send a ticker message: setting it, even to the same
# text again, scrolls it through once.
text:
  - platform: template
    name: Ticker Message
    icon: mdi:message-text
    mode: text
    max_length: 255
    optimistic: true
    set_action:
      - script.execute:
          id: queue_ticker_message
          message: !lambda return x;

button:
  - platform: restart
    name: Restart
    entity_category: config
  # Everything that changes how the clock looks and behaves, back to the
  # defaults: white, 35% contrast, solid, beat and weekday on, date off.
  - platform: template
    name: Reset Clock Settings
    icon: mdi:restore
    entity_category: config
    on_press:
      - light.turn_on:
          id: display_light
          brightness: 87%
          red: 100%
          green: 100%
          blue: 100%
      - select.set:
          id: clock_style
          option: Solid
      - switch.turn_on: clock_beat
      - switch.turn_on: weekday_ticker
      - switch.turn_off: date_ticker

font:
  # Jersey 10 is drawn on a 10 unit pixel grid. At 50px every font pixel is
  # exactly 5 panel pixels, so 1 bpp stays sharp and anti-aliasing would only
  # blur it. 50 is also the largest such size where the widest time, 23:39,
  # fits (86px); proportional digits make 11:11 half as wide.
  - file: gfonts://Jersey 10
    id: font_time
    size: 50
    # Printable ASCII plus German umlauts, for the weekday and for messages
    # from Home Assistant. Anything else is skipped when drawn.
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ÄÖÜäöüß°€"
  # The pulse frame. 40px is 4x the pixel grid, so it is just as sharp.
  - file: gfonts://Jersey 10
    id: font_time_pulse
    size: 40
    glyphs: "0123456789-"
  - file: gfonts://Roboto
    id: font_small
    size: 11

display:
  - platform: ssd1331_spi
    id: oled
    spi_id: bus_spi
    cs_pin:
      aw9523b_id: expander
      number: 7
      mode:
        output: true
    dc_pin:
      aw9523b_id: expander
      number: 13
      mode:
        output: true
    reset_pin:
      aw9523b_id: expander
      number: 12
      mode:
        output: true
    # Proven on this panel. The Pocuter library pushes 80MHz, the SSD1331
    # datasheet says 6.6MHz. 40MHz raises a full frame from 30 to 42 fps.
    data_rate: 8MHz
    # Only the value until on_boot applies the Display light's brightness.
    brightness: 35%
    update_interval: never
    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid())
        now = id(sntp_time).now();
      // Four digits, no colon: the beat replaces the blinking colon. The
      // digits are proportional, so the string is centred as a whole and
      // moves slightly as the time changes. Both sizes centre their digits on
      // y 27: baseline 41 for the 28px tall 50px font, 38 for the 21px 40px.
      bool pulse = id(clock_pulse);
      auto *clock_font = pulse ? id(font_time_pulse) : id(font_time);
      int baseline = pulse ? 38 : 41;

      // Colour from the Display light, style from Clock Style: 0 solid, 1
      // two-tone (hours in the colour, minutes white), 2 gradient (the colour
      // at the top fading to 40% of it at the bottom). The ticker follows.
      auto &light = id(display_light).current_values;
      Color main(uint8_t(light.get_red() * 255), uint8_t(light.get_green() * 255), uint8_t(light.get_blue() * 255));
      Color white(255, 255, 255);
      size_t style = id(clock_style).active_index().value_or(0);
      auto width = [&](font::Font *f, const char *text) {
        int x1, y1, w, h;
        it.get_text_bounds(0, 0, text, f, TextAlign::BASELINE_LEFT, &x1, &y1, &w, &h);
        return w;
      };
      // Text left-aligned on a baseline. The gradient is the text drawn once
      // per horizontal band over the cap height, each band clipped to its
      // rows; the outer bands reach the screen edges for accents and
      // descenders. That costs CPU only, about 1.3ms per band and string.
      auto draw = [&](int x, int y, font::Font *f, const char *text) {
        if (style != 2) {
          it.print(x, y, f, main, TextAlign::BASELINE_LEFT, text);
          return;
        }
        static const int BANDS = 5;
        int top = y - f->get_capheight();
        for (int i = 0; i < BANDS; i++) {
          float k = 1.0f - 0.6f * i / (BANDS - 1);
          Color c(uint8_t(main.r * k), uint8_t(main.g * k), uint8_t(main.b * k));
          int y0 = i == 0 ? 0 : top + (y - top) * i / BANDS;
          int y1 = i == BANDS - 1 ? it.get_height() : top + (y - top) * (i + 1) / BANDS;
          it.start_clipping(0, y0, it.get_width(), y1);
          it.print(x, y, f, c, TextAlign::BASELINE_LEFT, text);
          it.end_clipping();
        }
      };
      auto draw_clock = [&](int x, int y, font::Font *f, const std::string &hhmm) {
        if (style == 1 && hhmm.size() == 4) {
          std::string hours = hhmm.substr(0, 2);
          it.print(x, y, f, main, TextAlign::BASELINE_LEFT, hours.c_str());
          it.print(x + width(f, hours.c_str()), y, f, white, TextAlign::BASELINE_LEFT, hhmm.c_str() + 2);
        } else {
          draw(x, y, f, hhmm.c_str());
        }
      };

      // Ticker: one strip scrolled left, clock, gap, text, gap, clock. It
      // starts and ends with the clock exactly where it normally sits, so the
      // last frame hands over to the plain clock seamlessly.
      bool scrolling = false;
      if (id(ticker_start) != 0) {
        static const int GAP = 24;
        static const int SPEED = 60;  // px per second
        std::string clock = now.is_valid() ? now.strftime("%H%M") : "----";
        const std::string &text = id(ticker_text);
        int w_clock = width(id(font_time), clock.c_str());
        int w_text = width(id(font_time), text.c_str());
        int total = w_clock + GAP + w_text + GAP;
        int off = (millis() - id(ticker_start)) * SPEED / 1000;
        if (off < total) {
          // Only what is on screen: every draw costs, even fully clipped.
          auto visible = [&](int x, int w) { return x + w > 0 && x < it.get_width(); };
          int x = 48 - w_clock / 2 - off;
          if (visible(x, w_clock))
            draw_clock(x, 41, id(font_time), clock);
          if (visible(x + w_clock + GAP, w_text))
            draw(x + w_clock + GAP, 41, id(font_time), text.c_str());
          if (visible(x + total, w_clock))
            draw_clock(x + total, 41, id(font_time), clock);
          scrolling = true;
        }
      }
      if (!scrolling) {
        id(ticker_start) = 0;
        if (now.is_valid()) {
          std::string clock = now.strftime("%H%M");
          draw_clock(48 - width(clock_font, clock.c_str()) / 2, baseline, clock_font, clock);
        } else {
          it.print(48, baseline, clock_font, Color(120, 120, 120), TextAlign::BASELINE_CENTER, "----");
        }
      }

      // Voltage only once a cell is known to be there, so a board without one
      // never shows it, not even in the first 30s after boot.
      float bv = id(battery_voltage).state;
      bool cell = id(battery_present).has_state() && id(battery_present).state;
      if (cell && !std::isnan(bv)) {
        it.printf(2, 62, id(font_small), Color(160, 160, 160), TextAlign::BOTTOM_LEFT, "%.2fV%s", bv,
                  id(charging).state ? " +" : "");
      }
      // Network state as a steady dot: green with Home Assistant, amber on
      // WiFi only, red offline. The beat of the digits shows the clock runs.
      Color dot = id(ha_time).now().is_valid() && api::global_api_server->is_connected()
                      ? Color(0, 200, 0)
                      : wifi::global_wifi_component->is_connected() ? Color(220, 140, 0) : Color(200, 0, 0);
      it.filled_circle(90, 56, 3, dot);
